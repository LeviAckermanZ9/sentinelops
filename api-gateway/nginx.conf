# ============================================================
# SentinelOps API Gateway — Nginx Configuration
# ============================================================
# Reverse proxy for all microservices with:
#   - Rate limiting
#   - Request ID propagation
#   - Custom JSON error responses
#   - Security headers
#   - Gzip compression
# ============================================================

# ---------------------------------------------------------------------------
# Rate Limiting Zone
# ---------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=2r/s;

# ---------------------------------------------------------------------------
# Upstream Definitions
# ---------------------------------------------------------------------------
upstream ml_service {
    server ml-service:8000;
    keepalive 16;
}

upstream auth_service {
    server auth-service:3001;
    keepalive 16;
}

upstream frontend {
    server frontend:5173;
}

# ---------------------------------------------------------------------------
# Server Block
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name _;

    # -------------------------------------------------------------------
    # General Settings
    # -------------------------------------------------------------------
    client_max_body_size 1m;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # -------------------------------------------------------------------
    # Request ID — Use built-in $request_id for tracing
    # -------------------------------------------------------------------
    set $request_id_value $request_id;

    # -------------------------------------------------------------------
    # Security Headers
    # -------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # -------------------------------------------------------------------
    # ML Service Routes
    # -------------------------------------------------------------------
    location /api/predict {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://ml_service/predict;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id_value;

        # Timeouts for ML inference
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location /api/predict/batch {
        limit_req zone=api_limit burst=5 nodelay;

        proxy_pass http://ml_service/predict/batch;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id_value;

        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    location /api/model/ {
        proxy_pass http://ml_service/model/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id_value;
    }

    # -------------------------------------------------------------------
    # Auth Service Routes
    # -------------------------------------------------------------------
    location /api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;

        proxy_pass http://auth_service/api/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id_value;
    }

    location /api/users/ {
        proxy_pass http://auth_service/api/users/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id_value;
        proxy_set_header Authorization $http_authorization;
    }

    # -------------------------------------------------------------------
    # Metrics (restricted access — only from internal/Prometheus)
    # -------------------------------------------------------------------
    location /metrics/ml {
        proxy_pass http://ml_service/metrics;
        # In production, restrict to Prometheus IP:
        # allow 10.0.0.0/8;
        # deny all;
    }

    location /metrics/auth {
        proxy_pass http://auth_service/metrics;
    }

    # -------------------------------------------------------------------
    # ML Service Health
    # -------------------------------------------------------------------
    location /api/health/ml {
        proxy_pass http://ml_service/health;
        proxy_set_header Host $host;
    }

    location /api/health/auth {
        proxy_pass http://auth_service/health;
        proxy_set_header Host $host;
    }

    # -------------------------------------------------------------------
    # Frontend (catch-all — must be last)
    # -------------------------------------------------------------------
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (for Vite HMR in development)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # -------------------------------------------------------------------
    # Custom JSON Error Responses
    # -------------------------------------------------------------------
    error_page 429 /429.json;
    location = /429.json {
        default_type application/json;
        return 429 '{"error":"TooManyRequests","message":"Rate limit exceeded. Please try again later."}';
    }

    error_page 502 /502.json;
    location = /502.json {
        default_type application/json;
        return 502 '{"error":"BadGateway","message":"The upstream service is unavailable. Please try again later."}';
    }

    error_page 503 /503.json;
    location = /503.json {
        default_type application/json;
        return 503 '{"error":"ServiceUnavailable","message":"The service is temporarily unavailable."}';
    }

    error_page 504 /504.json;
    location = /504.json {
        default_type application/json;
        return 504 '{"error":"GatewayTimeout","message":"The upstream service timed out."}';
    }
}
