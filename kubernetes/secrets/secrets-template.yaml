# ============================================================
# SentinelOps — Kubernetes Secrets Template
# ============================================================
# IMPORTANT: Do NOT commit this file with actual values!
# Use: kubectl create secret generic auth-secrets \
#        --from-literal=JWT_SECRET='your-secret' \
#        --from-literal=JWT_REFRESH_SECRET='your-refresh-secret' \
#        --from-literal=MONGO_URI='mongodb://mongo:27017/sentinelops' \
#        -n sentinelops
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: auth-secrets
  namespace: sentinelops
type: Opaque
stringData:
  JWT_SECRET: "CHANGE_ME_IN_PRODUCTION"
  JWT_REFRESH_SECRET: "CHANGE_ME_IN_PRODUCTION"
  MONGO_URI: "mongodb://mongo:27017/sentinelops"
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-secrets
  namespace: sentinelops
type: Opaque
stringData:
  admin-password: "CHANGE_ME_IN_PRODUCTION"
