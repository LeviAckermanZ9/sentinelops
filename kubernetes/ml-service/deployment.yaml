apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-service
  namespace: sentinelops
  labels:
    app: ml-service
    component: inference
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ml-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ml-service
        component: inference
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: ml-service
          image: sentinelops/ml-service:latest  # Updated by Jenkins with SHA tag
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: MODEL_NAME
              valueFrom:
                configMapKeyRef:
                  name: ml-service-config
                  key: MODEL_NAME
            - name: MODEL_CACHE_DIR
              value: /app/models
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: ml-service-config
                  key: LOG_LEVEL
            - name: CORS_ORIGINS
              value: "*"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: model-cache
              mountPath: /app/models
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: ml-model-cache-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ml-model-cache-pvc
  namespace: sentinelops
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 2Gi
  storageClassName: gp2   # AWS EBS — adjust for your cloud provider
